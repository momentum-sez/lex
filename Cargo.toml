[workspace]
resolver = "2"
members = [
    "crates/lex-core",
    "crates/lex-diag",
    "crates/lex-cli",
    "crates/mass-canonical",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.dependencies]
# Foundational types (CanonicalBytes, sha256_digest, ComplianceDomain) are
# provided by the in-tree `mass-canonical` crate, so a cold clone of this
# repository compiles without external checkouts.
mass-canonical = { path = "crates/mass-canonical" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Testing
proptest = "1"
criterion = "0.5"
