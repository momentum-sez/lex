name: cold-clone

# Verifies the workspace is genuinely self-contained: a fresh clone of
# *this repository alone* (no sibling checkouts, no preconfigured
# environment) builds and tests cleanly. Catches any path dependency that
# silently relies on a sibling repo.

on:
  push:
    branches: [main, master, frontier/core-calculus, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cold-clone:
    runs-on: ubuntu-latest
    steps:
      - name: fresh clone in scratch dir
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          git clone --no-checkout "https://github.com/${{ github.repository }}.git" "$scratch/repository"
          git -C "$scratch/repository" fetch origin "$GITHUB_SHA"
          git -C "$scratch/repository" worktree add "$scratch/source" \
            -b "verification/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
          printf 'LEX_COLD_CLONE=%s\n' "$scratch/source" >> "$GITHUB_ENV"
          test "$(git -C "$scratch/source" rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check from scratch clone
        run: |
          set -euo pipefail
          cd "$LEX_COLD_CLONE"
          cargo check --workspace --all-targets
      - name: cargo test from scratch clone
        run: |
          set -euo pipefail
          cd "$LEX_COLD_CLONE"
          cargo test --workspace --all-targets
